[project]
name = "mission-return-server"
version = "0.1.0"
description = "Mission Return の WebSocket ゲームサーバー（計算は docs/design/reference_sim.py）"
requires-python = ">=3.11"
dependencies = ["websockets>=13", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
